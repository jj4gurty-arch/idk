<!DOCTYPE html>
<html>
<head>
    <title>Download Game</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #000000, #1a0033, #000033);
            background-size: 400% 400%;
            animation: bgFlow 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glowing neon button */
        button {
            padding: 22px 70px;
            font-size: 30px;
            color: #ff00ff;
            background: transparent;
            border: 3px solid #ff00ff;
            border-radius: 14px;
            cursor: pointer;
            text-shadow: 0 0 12px #ff00ff;
            box-shadow: 0 0 25px #ff00ff, inset 0 0 25px #ff00ff;
            transition: 0.25s ease;
        }

        button:hover {
            transform: scale(1.12);
            box-shadow: 0 0 40px #ff00ff, inset 0 0 40px #ff00ff;
        }

        /* Floating neon particles */
        .particle {
            position: absolute;
            width: 7px;
            height: 7px;
            background: #ff00ff;
            border-radius: 50%;
            opacity: 0.7;
            animation: floatUp 7s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0.2; }
            100% { transform: translateY(-10vh) scale(1.6); opacity: 1; }
        }
    </style>
</head>

<body>

<button onclick="forceDownload()">Download Game</button>

<script>
function forceDownload() {
    const file = "gmfghyfhgfhfghf.zip"; // <-- your exact ZIP name

    const link = document.createElement("a");
    link.href = file;
    link.download = file;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

// Create floating neon particles
for (let i = 0; i < 45; i++) {
    let p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDelay = Math.random() * 5 + "s";
    p.style.opacity = Math.random();
    document.body.appendChild(p);
}
</script>

</body>
</html>
